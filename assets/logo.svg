<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)" />
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- Abstract Grid Base (Stylized Spreadsheet) -->
  <g transform="translate(110, 110)">
    <!-- Sheet Outline -->
    <rect x="0" y="0" width="280" height="280" rx="28" fill="#1E293B" stroke="#38BDF8" stroke-width="4" stroke-opacity="0.3"/>
    
    <!-- Header Row -->
    <rect x="12" y="12" width="256" height="48" rx="14" fill="url(#blueGrad)" opacity="0.9"/>
    <circle cx="40" cy="36" r="6" fill="#FFFFFF" opacity="0.8"/>
    <rect x="60" y="31" width="60" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
    <rect x="140" y="31" width="50" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
    <rect x="210" y="31" width="40" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>

    <!-- Row 1 -->
    <rect x="12" y="72" width="76" height="56" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="95" width="52" height="10" rx="5" fill="#64748B" opacity="0.6"/>

    <rect x="100" y="72" width="76" height="56" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="112" y="95" width="52" height="10" rx="5" fill="#64748B" opacity="0.6"/>

    <rect x="188" y="72" width="80" height="56" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="200" y="95" width="56" height="10" rx="5" fill="#64748B" opacity="0.6"/>

    <!-- Row 2 -->
    <rect x="12" y="140" width="76" height="56" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="163" width="52" height="10" rx="5" fill="#64748B" opacity="0.6"/>

    <rect x="100" y="140" width="76" height="56" rx="12" fill="url(#blueGrad)" opacity="0.2" stroke="#2563EB" stroke-width="2"/>
    <rect x="112" y="163" width="52" height="10" rx="5" fill="#38BDF8"/>

    <rect x="188" y="140" width="80" height="56" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="200" y="163" width="56" height="10" rx="5" fill="#64748B" opacity="0.6"/>

    <!-- Row 3 -->
    <rect x="12" y="208" width="76" height="60" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="24" y="233" width="52" height="10" rx="5" fill="#64748B" opacity="0.6"/>

    <rect x="100" y="208" width="76" height="60" rx="12" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <rect x="112" y="233" width="52" height="10" rx="5" fill="#64748B" opacity="0.6"/>

    <rect x="188" y="208" width="80" height="60" rx="12" fill="url(#cyanGrad)" opacity="0.25" stroke="#06B6D4" stroke-width="2"/>
    <rect x="200" y="233" width="56" height="10" rx="5" fill="#06B6D4"/>
  </g>

  <!-- Cleansing Diamond / Sparkle Emblem Overlay -->
  <g transform="translate(320, 90)" filter="url(#glow)">
    <path d="M 40 0 Q 40 40 80 40 Q 40 40 40 80 Q 40 40 0 40 Q 40 40 40 0 Z" fill="url(#sparkleGrad)" />
    <circle cx="40" cy="40" r="10" fill="#FFFFFF"/>
  </g>

  <g transform="translate(85, 340)" filter="url(#glow)">
    <path d="M 25 0 Q 25 25 50 25 Q 25 25 25 50 Q 25 25 0 25 Q 25 25 25 0 Z" fill="url(#cyanGrad)" opacity="0.85"/>
  </g>

  <!-- Dycson Monogram Accent (DCS) -->
  <text x="250" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="6">DYCSON</text>
  <text x="250" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="4">CLEANING STUDIO</text>
</svg>
